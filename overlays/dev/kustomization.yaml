apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taxcalc-dev
resources:
  - ../../base
images:
  - name: uptimecrew/taxcalc-api
    newName: uptimecrew/taxcalc-api
    newTag: "0.1.0"
patches:
  - target:
      kind: ConfigMap
      name: taxcalc-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: "dev"
      - op: add
        path: /data/LOG_LEVEL
        value: "DEBUG"
  - target:
      kind: Deployment
      name: taxcalc-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # taxcalc-api-worker's SPRING_PROFILES_ACTIVE stays "worker" (set directly on
  # the container, not via the shared ConfigMap's SPRING_PROFILES_ACTIVE key
  # patched above) in every overlay — the worker's run mode is not an
  # environment concern the way the API's dev/staging/prod profile is.
  - target:
      kind: Deployment
      name: taxcalc-api-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
