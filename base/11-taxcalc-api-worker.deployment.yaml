apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxcalc-api-worker
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name: taxcalc-api-worker
    app.kubernetes.io/part-of: taxcalc
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: worker
spec:
  # Scaled 0<->maxReplicas by KEDA (see taxcalc-worker-scaledobject.yaml) off
  # Kafka consumer-group lag for taxcalc-read-model-builder, not by a
  # human/GitOps-set replica count. 0 here is only the value Argo CD applies
  # before KEDA's HPA takes ownership of spec.replicas on first scale event.
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taxcalc-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxcalc-api-worker
        app.kubernetes.io/part-of: taxcalc
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: taxcalc-api-worker
          # Same image as taxcalc-api: the worker is the existing application
          # run in a different Spring profile (worker), not a separate build.
          image: uptimecrew/taxcalc-api:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: taxcalc-api-config
            - secretRef:
                name: taxcalc-api-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "worker"
            # Set here, not only in application.yml's worker profile:
            # spring.main.web-application-type is bound before profile-specific
            # documents are guaranteed to apply, and the shared
            # taxcalc-api-config ConfigMap (envFrom above) sets SERVER_PORT,
            # so without this the worker starts Tomcat on 8080.
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: "none"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.taxcalc-dev.svc.cluster.local:9092"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # No probes: worker mode runs spring.main.web-application-type: none,
          # so there is no HTTP port for the image's baked-in HealthCheck (a
          # TCP-connect probe against 8080 — see the Dockerfile's healthcheck
          # stage) to reach, and the distroless runtime has no shell for an
          # exec probe. Liveness is process-exit based: kubelet already
          # restarts the container on JVM exit (see JAVA_TOOL_OPTIONS's
          # ExitOnOutOfMemoryError above) with no probe required.
