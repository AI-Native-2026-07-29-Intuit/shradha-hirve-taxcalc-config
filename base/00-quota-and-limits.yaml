apiVersion: v1
kind: ResourceQuota
metadata:
  name: taxcalc-dev-quota
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name: taxcalc
    app.kubernetes.io/part-of: taxcalc
    app.kubernetes.io/managed-by: kubectl
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: taxcalc-dev-limits
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name: taxcalc
    app.kubernetes.io/part-of: taxcalc
    app.kubernetes.io/managed-by: kubectl
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 768Mi
