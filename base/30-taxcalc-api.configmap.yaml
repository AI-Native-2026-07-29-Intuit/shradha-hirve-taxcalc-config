apiVersion: v1
kind: ConfigMap
metadata:
  name: taxcalc-api-config
  namespace: taxcalc-dev
  labels:
    app.kubernetes.io/name: taxcalc-api
    app.kubernetes.io/part-of: taxcalc
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: api
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.taxcalc-dev.svc.cluster.local:5432/taxcalc_dev"
  SPRING_DATASOURCE_USERNAME: "taxcalc_dev"
  SPRING_DATA_REDIS_HOST: "redis.taxcalc-dev.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.taxcalc-dev.svc.cluster.local:9092"
  SPRING_DATA_MONGODB_URI: "mongodb://mongo.taxcalc-dev.svc.cluster.local:27017/taxcalc"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.taxcalc-dev.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "taxcalc-api"
